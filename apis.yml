aid: txone-networks
name: TXOne Networks
description: >-
  TXOne Networks is an operations-first OT (operational technology) cybersecurity
  company headquartered in Taipei, Taiwan, founded in 2019 as a joint venture
  between Trend Micro and Moxa and now operating independently. It protects
  industrial control systems, production floors and critical infrastructure with a
  prevention-first architecture designed to deploy without production downtime.
  The TXOne Complete portfolio unifies Edge (EdgeIPS Pro, EdgeFire, EdgeOne network
  security), Stellar (Stellar Protect, Stellar Discover, StellarOne endpoint
  protection), Element (Portable Inspector, Safe Port, ElementOne security
  inspection) and Sennin (SenninRecon, SenninOne, SageOne discovery, assessment and
  strategic governance), powered by CPSDR behavioral detection, TXODI deep packet
  inspection across 180+ industrial protocols, and VSAR operational-context
  vulnerability scoring. Products are delivered as customer-deployed appliances and
  on-premises management consoles rather than a public multi-tenant cloud service,
  so the REST/OpenAPI surfaces those consoles expose (SageOne OpenAPI 1.0 for asset
  management, health checks and vulnerability data; the StellarOne open API; EdgeOne
  API management) are reachable only inside a customer's own deployment. TXOne
  publishes no public developer portal, API reference or pricing page.
